<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'IBM Plex Mono',monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#EAF2FB" stroke-width="1"/>
    </pattern>
    <linearGradient id="film2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCEAF7"/>
      <stop offset="0.5" stop-color="#F5F9FD"/>
      <stop offset="1" stop-color="#C9DCF0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#FAFBFC"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#0B1F3A" stroke-width="2"/>
  <rect x="32" y="32" width="736" height="536" fill="none" stroke="#0B1F3A" stroke-width="0.75"/>

  <!-- Layflat tube, cross-section -->
  <g transform="translate(150,140)">
    <path d="M60 40 C120 -10, 300 -10, 360 40 L360 260 C300 310, 120 310, 60 260 Z"
          fill="url(#film2)" stroke="#0B1F3A" stroke-width="3"/>
    <!-- open top -->
    <ellipse cx="210" cy="42" rx="150" ry="34" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="2.5"/>
    <ellipse cx="210" cy="42" rx="112" ry="22" fill="#F5F9FD" stroke="#9CC6F5" stroke-width="1.5"/>
    <!-- gauge callout band -->
    <line x1="60" y1="160" x2="360" y2="160" stroke="#9CC6F5" stroke-width="1.25" stroke-dasharray="6 6"/>
  </g>

  <!-- Thickness dimension -->
  <g stroke="#1E4E79" stroke-width="1.5">
    <line x1="580" y1="182" x2="580" y2="212"/>
    <line x1="572" y1="182" x2="588" y2="182"/>
    <line x1="572" y1="212" x2="588" y2="212"/>
  </g>
  <text x="604" y="202" fill="#1E4E79" font-size="13">T 30 MICRON</text>

  <!-- Width dimension -->
  <g stroke="#1E4E79" stroke-width="1.5">
    <line x1="210" y1="420" x2="510" y2="420"/>
    <line x1="210" y1="412" x2="210" y2="428"/>
    <line x1="510" y1="412" x2="510" y2="428"/>
  </g>
  <text x="360" y="446" fill="#1E4E79" font-size="13" text-anchor="middle">LAYFLAT W 500 MM</text>

  <!-- Title block -->
  <g transform="translate(56,474)">
    <rect x="0" y="0" width="208" height="102" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="1.5"/>
    <line x1="0" y1="36" x2="208" y2="36" stroke="#0B1F3A" stroke-width="1"/>
    <line x1="0" y1="70" x2="208" y2="70" stroke="#0B1F3A" stroke-width="1"/>
    <text x="12" y="24" fill="#0B1F3A" font-size="15" letter-spacing="2">POLYCONNECT</text>
    <text x="12" y="58" fill="#55636F" font-size="12">ITEM: LDPE SHRINK · D2</text>
    <text x="12" y="92" fill="#55636F" font-size="12">VIEW: SECTION · SHRINK 35–45%</text>
  </g>
  <path d="M740 44l16 16M740 60l16 -16" stroke="#0B1F3A" stroke-width="1.5"/>
</svg>
