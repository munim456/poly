<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'IBM Plex Mono',monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#EAF2FB" stroke-width="1"/>
    </pattern>
    <pattern id="weave2" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#EAF2FB"/>
      <path d="M0 6h12M6 0v12" stroke="#C4D6E9" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#FAFBFC"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#0B1F3A" stroke-width="2"/>
  <rect x="32" y="32" width="736" height="536" fill="none" stroke="#0B1F3A" stroke-width="0.75"/>

  <!-- Stacked sacks, slight offsets -->
  <g transform="translate(160,330)">
    <rect x="0" y="0" width="400" height="130" fill="url(#weave2)" stroke="#0B1F3A" stroke-width="2.5"/>
    <line x1="18" y1="0" x2="18" y2="130" stroke="#55636F" stroke-width="1" stroke-dasharray="4 5"/>
    <line x1="382" y1="0" x2="382" y2="130" stroke="#55636F" stroke-width="1" stroke-dasharray="4 5"/>
    <rect x="120" y="42" width="160" height="46" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="1.5"/>
    <text x="200" y="70" text-anchor="middle" fill="#1E4E79" font-size="13" letter-spacing="2">50 KG NET</text>
  </g>
  <g transform="translate(190,205)">
    <rect x="0" y="0" width="400" height="125" fill="url(#weave2)" stroke="#0B1F3A" stroke-width="2.5"/>
    <line x1="18" y1="0" x2="18" y2="125" stroke="#55636F" stroke-width="1" stroke-dasharray="4 5"/>
    <line x1="382" y1="0" x2="382" y2="125" stroke="#55636F" stroke-width="1" stroke-dasharray="4 5"/>
    <rect x="120" y="40" width="160" height="45" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="1.5"/>
    <text x="200" y="67" text-anchor="middle" fill="#1E4E79" font-size="13" letter-spacing="2">50 KG NET</text>
  </g>
  <g transform="translate(220,84)">
    <rect x="0" y="0" width="400" height="121" fill="url(#weave2)" stroke="#0B1F3A" stroke-width="2.5"/>
    <line x1="18" y1="0" x2="18" y2="121" stroke="#55636F" stroke-width="1" stroke-dasharray="4 5"/>
    <line x1="382" y1="0" x2="382" y2="121" stroke="#55636F" stroke-width="1" stroke-dasharray="4 5"/>
    <rect x="120" y="38" width="160" height="45" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="1.5"/>
    <text x="200" y="65" text-anchor="middle" fill="#1E4E79" font-size="13" letter-spacing="2">50 KG NET</text>
  </g>

  <!-- Stack height dimension -->
  <g stroke="#1E4E79" stroke-width="1.5">
    <line x1="668" y1="84" x2="668" y2="460"/>
    <line x1="660" y1="84" x2="676" y2="84"/>
    <line x1="660" y1="460" x2="676" y2="460"/>
  </g>
  <text x="700" y="280" fill="#1E4E79" font-size="14" transform="rotate(90 700 280)" text-anchor="middle">STACK ×3</text>

  <!-- Title block -->
  <g transform="translate(44,398)">
    <rect x="0" y="0" width="208" height="156" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="1.5"/>
    <line x1="0" y1="36" x2="208" y2="36" stroke="#0B1F3A" stroke-width="1"/>
    <line x1="0" y1="72" x2="208" y2="72" stroke="#0B1F3A" stroke-width="1"/>
    <line x1="0" y1="108" x2="208" y2="108" stroke="#0B1F3A" stroke-width="1"/>
    <text x="12" y="24" fill="#0B1F3A" font-size="15" letter-spacing="2">POLYCONNECT</text>
    <text x="12" y="58" fill="#55636F" font-size="12">ITEM: HDPE WOVEN SACK</text>
    <text x="12" y="94" fill="#55636F" font-size="12">LOAD: 50 KG / SACK</text>
    <text x="12" y="130" fill="#55636F" font-size="12">VIEW: STACKED · PLATE A2</text>
  </g>
  <path d="M740 44l16 16M740 60l16 -16" stroke="#0B1F3A" stroke-width="1.5"/>
