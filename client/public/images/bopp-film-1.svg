<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'IBM Plex Mono',monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#EAF2FB" stroke-width="1"/>
    </pattern>
    <linearGradient id="film" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCEAF7"/>
      <stop offset="0.5" stop-color="#F5F9FD"/>
      <stop offset="1" stop-color="#C9DCF0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#FAFBFC"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#0B1F3A" stroke-width="2"/>
  <rect x="32" y="32" width="736" height="536" fill="none" stroke="#0B1F3A" stroke-width="0.75"/>

  <!-- Film roll on core -->
  <g transform="translate(150,110)">
    <circle cx="150" cy="190" r="170" fill="url(#film)" stroke="#0B1F3A" stroke-width="3"/>
    <circle cx="150" cy="190" r="168" fill="none" stroke="#0B1F3A" stroke-width="1" stroke-dasharray="3 7"/>
    <circle cx="150" cy="190" r="46" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="2.5"/>
    <circle cx="150" cy="190" r="18" fill="#EAF2FB" stroke="#55636F" stroke-width="1.5"/>
    <!-- film layers hint -->
    <path d="M150 20a170 170 0 0 1 147 85" fill="none" stroke="#2F86EB" stroke-width="2.5"/>
    <path d="M150 44a146 146 0 0 1 126 73" fill="none" stroke="#2F86EB" stroke-width="1.5" opacity="0.6"/>
    <!-- unrolled sheet -->
    <path d="M296 122 L560 74 L560 210 L282 260 Z" fill="#F5F9FD" stroke="#0B1F3A" stroke-width="2.5"/>
    <path d="M310 128 L545 86 M305 148 L545 108 M300 168 L545 130 M296 188 L545 152" stroke="#9CC6F5" stroke-width="1.25"/>
  </g>

  <!-- Width dimension of sheet -->
  <g stroke="#1E4E79" stroke-width="1.5">
    <line x1="430" y1="290" x2="700" y2="240"/>
    <line x1="433" y1="282" x2="427" y2="298"/>
    <line x1="703" y1="232" x2="697" y2="248"/>
  </g>
  <text x="585" y="292" fill="#1E4E79" font-size="14" text-anchor="middle" transform="rotate(-10 585 292)">WEB W 1000 MM</text>

  <!-- Title block -->
  <g transform="translate(56,398)">
    <rect x="0" y="0" width="208" height="156" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="1.5"/>
    <line x1="0" y1="36" x2="208" y2="36" stroke="#0B1F3A" stroke-width="1"/>
    <line x1="0" y1="72" x2="208" y2="72" stroke="#0B1F3A" stroke-width="1"/>
    <line x1="0" y1="108" x2="208" y2="108" stroke="#0B1F3A" stroke-width="1"/>
    <text x="12" y="24" fill="#0B1F3A" font-size="15" letter-spacing="2">POLYCONNECT</text>
    <text x="12" y="58" fill="#55636F" font-size="12">ITEM: BOPP PRINT FILM</text>
    <text x="12" y="94" fill="#55636F" font-size="12">GAUGE: 20 MICRON</text>
    <text x="12" y="130" fill="#55636F" font-size="12">VIEW: ROLL FACE · PLATE B1</text>
  </g>
  <path d="M740 44l16 16M740 60l16 -16" stroke="#0B1F3A" stroke-width="1.5"/>
</svg>
