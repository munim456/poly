<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'IBM Plex Mono',monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#EAF2FB" stroke-width="1"/>
    </pattern>
    <pattern id="twist" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(24)">
      <path d="M0 8h16" stroke="#C4D6E9" stroke-width="4"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#FAFBFC"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#0B1F3A" stroke-width="2"/>
  <rect x="32" y="32" width="736" height="536" fill="none" stroke="#0B1F3A" stroke-width="0.75"/>

  <!-- Three bobbins -->
  <g transform="translate(140,150)">
    <g transform="translate(0,0)">
      <rect x="0" y="-14" width="34" height="308" rx="6" fill="#EAF2FB" stroke="#0B1F3A" stroke-width="2.25"/>
      <rect x="150" y="-14" width="34" height="308" rx="6" fill="#EAF2FB" stroke="#0B1F3A" stroke-width="2.25"/>
      <rect x="30" y="30" width="124" height="220" fill="url(#twist)" stroke="#0B1F3A" stroke-width="2.25"/>
    </g>
    <g transform="translate(230,26)">
      <rect x="0" y="-12" width="28" height="256" rx="5" fill="#EAF2FB" stroke="#0B1F3A" stroke-width="2"/>
      <rect x="122" y="-12" width="28" height="256" rx="5" fill="#EAF2FB" stroke="#0B1F3A" stroke-width="2"/>
      <rect x="26" y="24" width="98" height="184" fill="url(#twist)" stroke="#0B1F3A" stroke-width="2"/>
    </g>
    <g transform="translate(300,52)">
      <rect x="0" y="-10" width="24" height="204" rx="5" fill="#EAF2FB" stroke="#0B1F3A" stroke-width="1.75"/>
      <rect x="96" y="-10" width="24" height="204" rx="5" fill="#EAF2FB" stroke="#0B1F3A" stroke-width="1.75"/>
      <rect x="22" y="20" width="76" height="148" fill="url(#twist)" stroke="#0B1F3A" stroke-width="1.75"/>
    </g>
  </g>

  <!-- UV stabilized callout -->
  <path d="M660 120l40 40M700 120l-40 40" stroke="#1E4E79" stroke-width="1.75"/>
  <text x="666" y="196" fill="#1E4E79" font-size="13">UV</text>
  <text x="666" y="214" fill="#1E4E79" font-size="13">STAB.</text>

  <!-- Title block -->
  <g transform="translate(44,452)">
    <rect x="0" y="0" width="208" height="102" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="1.5"/>
    <line x1="0" y1="36" x2="208" y2="36" stroke="#0B1F3A" stroke-width="1"/>
    <line x1="0" y1="70" x2="208" y2="70" stroke="#0B1F3A" stroke-width="1"/>
    <text x="12" y="24" fill="#0B1F3A" font-size="15" letter-spacing="2">POLYCONNECT</text>
    <text x="12" y="58" fill="#55636F" font-size="12">ITEM: PP YARN · C2</text>
    <text x="12" y="92" fill="#55636F" font-size="12">VIEW: BOBBIN GROUP</text>
  </g>
  <path d="M740 44l16 16M740 60l16 -16" stroke="#0B1F3A" stroke-width="1.5"/>
</svg>
