<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'IBM Plex Mono',monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#EAF2FB" stroke-width="1"/>
    </pattern>
    <linearGradient id="film3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F9FD"/>
      <stop offset="1" stop-color="#C9DCF0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#FAFBFC"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#0B1F3A" stroke-width="2"/>
  <rect x="32" y="32" width="736" height="536" fill="none" stroke="#0B1F3A" stroke-width="0.75"/>

  <!-- Printed pouch with registration marks -->
  <g transform="translate(220,130)">
    <rect x="0" y="0" width="360" height="330" rx="14" fill="url(#film3)" stroke="#0B1F3A" stroke-width="3"/>
    <!-- crimp seals top/bottom -->
    <path d="M10 34h340M10 296h340" stroke="#55636F" stroke-width="2.5" stroke-dasharray="9 6"/>
    <!-- printed art zone -->
    <circle cx="180" cy="150" r="74" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="2"/>
    <text x="180" y="142" text-anchor="middle" fill="#0B1F3A" font-size="17" letter-spacing="3">BRAND</text>
    <line x1="120" y1="166" x2="240" y2="166" stroke="#2F86EB" stroke-width="2.5"/>
    <line x1="140" y1="182" x2="220" y2="182" stroke="#9CC6F5" stroke-width="2"/>
    <!-- CMYK reg marks -->
    <g transform="translate(28,58)">
      <circle cx="0" cy="0" r="7" fill="none" stroke="#0B1F3A" stroke-width="1.25"/>
      <line x1="-11 0" x2="11" y1="0" y2="0" stroke="#0B1F3A" stroke-width="1.25"/>
      <line x1="0" y1="-11" x2="0" y2="11" stroke="#0B1F3A" stroke-width="1.25"/>
    </g>
    <g transform="translate(332,272)">
      <circle cx="0" cy="0" r="7" fill="none" stroke="#0B1F3A" stroke-width="1.25"/>
      <line x1="-11" y1="0" x2="11" y2="0" stroke="#0B1F3A" stroke-width="1.25"/>
      <line x1="0" y1="-11" x2="0" y2="11" stroke="#0B1F3A" stroke-width="1.25"/>
    </g>
  </g>

  <!-- Clarity callout -->
  <text x="640" y="120" fill="#1E4E79" font-size="13">CLARITY ≥ 92%</text>
  <path d="M636 128 C600 160, 590 190, 586 214" stroke="#1E4E79" stroke-width="1.5" fill="none"/>

  <!-- Title block -->
  <g transform="translate(56,474)">
    <rect x="0" y="0" width="208" height="102" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="1.5"/>
    <line x1="0" y1="36" x2="208" y2="36" stroke="#0B1F3A" stroke-width="1"/>
    <line x1="0" y1="70" x2="208" y2="70" stroke="#0B1F3A" stroke-width="1"/>
    <text x="12" y="24" fill="#0B1F3A" font-size="15" letter-spacing="2">POLYCONNECT</text>
    <text x="12" y="58" fill="#55636F" font-size="12">ITEM: BOPP POUCH · B2</text>
    <text x="12" y="92" fill="#55636F" font-size="12">VIEW: PRINT APPLICATION</text>
  </g>
  <path d="M740 44l16 16M740 60l16 -16" stroke="#0B1F3A" stroke-width="1.5"/>
</svg>
