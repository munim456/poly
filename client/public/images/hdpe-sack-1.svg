<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'IBM Plex Mono',monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#EAF2FB" stroke-width="1"/>
    </pattern>
    <pattern id="weave" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#EAF2FB"/>
      <path d="M0 7h14M7 0v14" stroke="#C4D6E9" stroke-width="2.5"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#FAFBFC"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#0B1F3A" stroke-width="2"/>
  <rect x="32" y="32" width="736" height="536" fill="none" stroke="#0B1F3A" stroke-width="0.75"/>

  <!-- Single sack, front elevation -->
  <g transform="translate(230,150)">
    <rect x="0" y="0" width="340" height="300" fill="url(#weave)" stroke="#0B1F3A" stroke-width="3"/>
    <!-- stitched top hem -->
    <line x1="0" y1="26" x2="340" y2="26" stroke="#55636F" stroke-width="2" stroke-dasharray="8 6"/>
    <line x1="0" y1="274" x2="340" y2="274" stroke="#55636F" stroke-width="2" stroke-dasharray="8 6"/>
    <!-- side gussets -->
    <path d="M34 26v248M306 26v248" stroke="#55636F" stroke-width="1.25" stroke-dasharray="4 5"/>
    <!-- label panel -->
    <rect x="90" y="90" width="160" height="120" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="2"/>
    <text x="170" y="130" text-anchor="middle" fill="#0B1F3A" font-size="16" letter-spacing="2">HDPE</text>
    <text x="170" y="156" text-anchor="middle" fill="#1E4E79" font-size="13" letter-spacing="1">WOVEN SACK</text>
    <line x1="110" y1="176" x2="230" y2="176" stroke="#C4D6E9" stroke-width="2"/>
    <line x1="126" y1="192" x2="214" y2="192" stroke="#C4D6E9" stroke-width="2"/>
  </g>

  <!-- Width dimension -->
  <g stroke="#1E4E79" stroke-width="1.5">
    <line x1="230" y1="486" x2="570" y2="486"/>
    <line x1="230" y1="478" x2="230" y2="494"/>
    <line x1="570" y1="478" x2="570" y2="494"/>
  </g>
  <text x="400" y="512" fill="#1E4E79" font-size="14" text-anchor="middle">W 600 MM</text>
  <!-- Height dimension -->
  <g stroke="#1E4E79" stroke-width="1.5">
    <line x1="196" y1="150" x2="196" y2="450"/>
    <line x1="188" y1="150" x2="204" y2="150"/>
    <line x1="188" y1="450" x2="204" y2="450"/>
  </g>
  <text x="180" y="304" fill="#1E4E79" font-size="14" transform="rotate(-90 180 304)" text-anchor="middle">H 900 MM</text>

  <!-- Title block -->
  <g transform="translate(560,398)">
    <rect x="0" y="0" width="196" height="156" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="1.5"/>
    <line x1="0" y1="36" x2="196" y2="36" stroke="#0B1F3A" stroke-width="1"/>
    <line x1="0" y1="72" x2="196" y2="72" stroke="#0B1F3A" stroke-width="1"/>
    <line x1="0" y1="108" x2="196" y2="108" stroke="#0B1F3A" stroke-width="1"/>
    <text x="12" y="24" fill="#0B1F3A" font-size="15" letter-spacing="2">POLYCONNECT</text>
    <text x="12" y="58" fill="#55636F" font-size="12">ITEM: HDPE SACK A1</text>
    <text x="12" y="94" fill="#55636F" font-size="12">SPEC: GSM 80 · WHITE</text>
    <text x="12" y="130" fill="#55636F" font-size="12">VIEW: FRONT ELEV.</text>
  </g>
  <path d="M740 44l16 16M740 60l16 -16" stroke="#0B1F3A" stroke-width="1.5"/>
</svg>
