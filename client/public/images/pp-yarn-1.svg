<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'IBM Plex Mono',monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#EAF2FB" stroke-width="1"/>
    </pattern>
    <pattern id="wind" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 9h18" stroke="#C4D6E9" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#FAFBFC"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#0B1F3A" stroke-width="2"/>
  <rect x="32" y="32" width="736" height="536" fill="none" stroke="#0B1F3A" stroke-width="0.75"/>

  <!-- Yarn spool elevation -->
  <g transform="translate(170,120)">
    <!-- flanges -->
    <rect x="0" y="-10" width="46" height="380" rx="8" fill="#EAF2FB" stroke="#0B1F3A" stroke-width="2.5"/>
    <rect x="374" y="-10" width="46" height="380" rx="8" fill="#EAF2FB" stroke="#0B1F3A" stroke-width="2.5"/>
    <!-- wound body -->
    <rect x="46" y="40" width="328" height="280" fill="url(#wind)" stroke="#0B1F3A" stroke-width="2.5"/>
    <path d="M46 110h328M46 180h328M46 250h328" stroke="#9CC6F5" stroke-width="1.25"/>
    <!-- core tube visible ends -->
    <rect x="-14" y="150" width="28" height="60" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="2"/>
    <rect x="406" y="150" width="28" height="60" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="2"/>
  </g>

  <!-- Filament strands exiting -->
  <g stroke="#2F86EB" stroke-width="1.75" fill="none">
    <path d="M648 300 C700 310, 720 340, 738 380"/>
    <path d="M648 290 C704 296, 728 318, 750 350"/>
    <path d="M648 280 C708 282, 736 296, 758 320"/>
  </g>

  <!-- Denier callout -->
  <g stroke="#1E4E79" stroke-width="1.5">
    <line x1="120" y1="160" x2="120" y2="400"/>
    <line x1="112" y1="160" x2="128" y2="160"/>
    <line x1="112" y1="400" x2="128" y2="400"/>
  </g>
  <text x="106" y="284" fill="#1E4E79" font-size="13" transform="rotate(-90 106 284)" text-anchor="middle">DENIER 600 · TENACITY 5.5 g/d</text>

  <!-- Title block -->
  <g transform="translate(44,452)">
    <rect x="0" y="0" width="208" height="102" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="1.5"/>
    <line x1="0" y1="36" x2="208" y2="36" stroke="#0B1F3A" stroke-width="1"/>
    <line x1="0" y1="70" x2="208" y2="70" stroke="#0B1F3A" stroke-width="1"/>
    <text x="12" y="24" fill="#0B1F3A" font-size="15" letter-spacing="2">POLYCONNECT</text>
    <text x="12" y="58" fill="#55636F" font-size="12">ITEM: PP YARN · C1</text>
    <text x="12" y="92" fill="#55636F" font-size="12">VIEW: SPOOL ELEVATION</text>
  </g>
  <path d="M740 44l16 16M740 60l16 -16" stroke="#0B1F3A" stroke-width="1.5"/>
</svg>
